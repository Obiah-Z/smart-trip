worker_processes 1;
pid /tmp/smart-trip-nginx/nginx.pid;
error_log /tmp/smart-trip-nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /tmp/smart-trip-nginx/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_temp_path /tmp/smart-trip-nginx/proxy_temp;
    client_body_temp_path /tmp/smart-trip-nginx/client_body_temp;
    fastcgi_temp_path /tmp/smart-trip-nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/smart-trip-nginx/uwsgi_temp;
    scgi_temp_path /tmp/smart-trip-nginx/scgi_temp;

    server {
        listen 127.0.0.1:18081;
        server_name trip.obiah.xyz obiah.xyz localhost 127.0.0.1;

        root /home/obiah/Desktop/smart-trip/frontend/dist;
        index index.html;

        client_max_body_size 20m;

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /media/generated/ {
            alias /home/obiah/Desktop/smart-trip/backend/data/generated_images/kolors/;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
            access_log off;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8001/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8001/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
