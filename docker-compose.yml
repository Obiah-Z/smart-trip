version: "2.4"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ${SMART_TRIP_ENV_FILE:-.env.production}
    volumes:
      - ./backend/data:/app/backend/data
    expose:
      - "8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY:-}
        VITE_AMAP_SECURITY_JSCODE: ${VITE_AMAP_SECURITY_JSCODE:-}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend/data/generated_images/kolors:/var/www/smart-trip/generated_images:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
